[package]
name = "marktype"
description = "A lightweight, Typora-style WYSIWYG Markdown editor"
authors = ["MarkType contributors"]
default-run = "marktype"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (cargo issue #8519).
name = "marktype_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "marktype"
path = "src/main.rs"

[dependencies]
ignore = "0.4.34"
notify = { version = "8.2.2", default-features = false, features = ["macos_fsevent"] }
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.7", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
tauri-plugin-single-instance = "2.5.5"
trash = "5.4.0"

[target.'cfg(windows)'.dependencies]
# Same versions as Tauri's WebView2 bindings (wry): direct PDF export (commands/pdf.rs).
webview2-com = "0.39.1"
windows = "0.62.2"

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dev-dependencies]
tempfile = "3.27.0"
