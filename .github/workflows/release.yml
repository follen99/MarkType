name: Release

# Pushing a tag like v1.0.0 builds the installers on every OS and attaches them to a *draft* GitHub release,
# which a maintainer then publishes from the Releases page. Tags below v1 (v0.x) and tags with a hyphen
# (v1.0.0-rc.1) are marked as pre-releases. The tag must match the version in Cargo.toml / package.json.
# Builds are not code-signed yet (docs/SPEC.md §17); signing secrets can be added to the env block later.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # One job creates the draft first, so the parallel builds upload to the same release instead of racing.
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches the app version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - uses: actions/github-script@v7
        id: create
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const body = [
              'Changes: see [CHANGELOG.md](https://github.com/follen99/MarkType/blob/main/CHANGELOG.md).',
              '',
              'Try it in the browser: https://follen99.github.io/MarkType/',
              '',
              '**Downloads**',
              '- Windows: `MarkType_*_x64-setup.exe` (recommended) or `.msi`',
              '- macOS (Intel and Apple Silicon): `.dmg`',
              '- Linux: `.AppImage`, `.deb` or `.rpm`',
              '',
              'The builds are not code-signed yet:',
              '- Windows: if SmartScreen appears, click *More info* → *Run anyway*.',
              '- macOS: right-click the app → *Open* → *Open* (only the first time).',
            ].join('\n');
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `MarkType ${tag}`,
              body,
              draft: true,
              prerelease: tag.startsWith('v0.') || tag.includes('-'),
            });
            return data.id;

  build:
    name: Build (${{ matrix.name }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            args: ''
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin
          - name: Linux x64
            os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
